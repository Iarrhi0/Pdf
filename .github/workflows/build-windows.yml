name: Universal ZIP Extract and Build

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "**.zip"
      - ".github/workflows/universal-unzip-build.yml"

permissions:
  contents: read

jobs:
  extract-and-build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract every project ZIP safely
        id: extract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $out = Join-Path $root '_extracted'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $zips = Get-ChildItem -Path $root -Filter '*.zip' -File -Recurse |
            Where-Object { $_.FullName -notlike "$out*" -and $_.FullName -notlike '*\.git\*' }

          if (-not $zips) {
            Write-Host 'No ZIP found. Using repository files as the project.'
            "workspace=$root" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($zip in $zips) {
            $relative = [IO.Path]::GetRelativePath($root, $zip.FullName)
            $safeName = [IO.Path]::GetFileNameWithoutExtension($zip.Name) -replace '[^a-zA-Z0-9._-]', '_'
            $destination = Join-Path $out $safeName
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            $destinationFull = [IO.Path]::GetFullPath($destination) + [IO.Path]::DirectorySeparatorChar

            $archive = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
            try {
              foreach ($entry in $archive.Entries) {
                if ([string]::IsNullOrEmpty($entry.FullName)) { continue }
                $target = [IO.Path]::GetFullPath((Join-Path $destination $entry.FullName))
                if (-not $target.StartsWith($destinationFull, [StringComparison]::OrdinalIgnoreCase)) {
                  throw "Unsafe ZIP path rejected: $($entry.FullName)"
                }
                if ([string]::IsNullOrEmpty($entry.Name)) {
                  New-Item -ItemType Directory -Force -Path $target | Out-Null
                } else {
                  New-Item -ItemType Directory -Force -Path ([IO.Path]::GetDirectoryName($target)) | Out-Null
                  [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $target, $true)
                }
              }
            } finally { $archive.Dispose() }
            Write-Host "Extracted $relative to $destination"
          }
          "workspace=$out" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Detect and build projects
        shell: pwsh
        env:
          PROJECT_ROOT: ${{ steps.extract.outputs.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = Join-Path (Get-Location) '_artifacts'
          New-Item -ItemType Directory -Force -Path $artifact | Out-Null
          $built = 0

          $dotnetProjects = Get-ChildItem $env:PROJECT_ROOT -Recurse -File -Filter '*.csproj'
          foreach ($project in $dotnetProjects) {
            $name = [IO.Path]::GetFileNameWithoutExtension($project.Name)
            $dest = Join-Path $artifact "dotnet-$name"
            dotnet restore $project.FullName
            dotnet publish $project.FullName -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o $dest
            $built++
          }

          $gradleRoots = Get-ChildItem $env:PROJECT_ROOT -Recurse -File -Filter 'gradlew.bat' |
            Select-Object -ExpandProperty Directory -Unique
          foreach ($dir in $gradleRoots) {
            Push-Location $dir.FullName
            try { & .\gradlew.bat assembleRelease --no-daemon }
            finally { Pop-Location }
            $name = $dir.Name -replace '[^a-zA-Z0-9._-]', '_'
            $dest = Join-Path $artifact "gradle-$name"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Get-ChildItem $dir.FullName -Recurse -File -Include '*.apk','*.aab','*.jar' |
              Copy-Item -Destination $dest -Force
            $built++
          }

          $nodeRoots = Get-ChildItem $env:PROJECT_ROOT -Recurse -File -Filter 'package.json' |
            Where-Object { $_.FullName -notlike '*\node_modules\*' } |
            Select-Object -ExpandProperty Directory -Unique
          foreach ($dir in $nodeRoots) {
            Push-Location $dir.FullName
            try {
              if (Test-Path 'package-lock.json') { npm ci } else { npm install }
              $package = Get-Content 'package.json' -Raw | ConvertFrom-Json
              if ($package.scripts.build) { npm run build }
            } finally { Pop-Location }
            $name = $dir.Name -replace '[^a-zA-Z0-9._-]', '_'
            $dest = Join-Path $artifact "node-$name"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            foreach ($candidate in @('dist','build','out','.output\public')) {
              $source = Join-Path $dir.FullName $candidate
              if (Test-Path $source) { Copy-Item $source -Destination $dest -Recurse -Force }
            }
            $built++
          }

          $staticRoots = Get-ChildItem $env:PROJECT_ROOT -Recurse -File -Filter 'index.html' |
            Where-Object { $_.FullName -notlike '*\node_modules\*' -and $_.FullName -notlike '*\dist\*' -and $_.FullName -notlike '*\build\*' } |
            Select-Object -ExpandProperty Directory -Unique
          foreach ($dir in $staticRoots) {
            $name = $dir.Name -replace '[^a-zA-Z0-9._-]', '_'
            Copy-Item $dir.FullName -Destination (Join-Path $artifact "static-$name") -Recurse -Force
            $built++
          }

          if ($built -eq 0) {
            Write-Warning 'Unknown project type. Publishing extracted source only.'
            Copy-Item $env:PROJECT_ROOT -Destination (Join-Path $artifact 'extracted-source') -Recurse -Force
          }

      - name: Upload build results
        uses: actions/upload-artifact@v4
        with:
          name: universal-build-${{ github.run_number }}
          path: _artifacts/
          if-no-files-found: error
          retention-days: 14
