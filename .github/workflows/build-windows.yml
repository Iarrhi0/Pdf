name: Build Chapter Search PDF V4 Native

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.zip'
      - '**/Assets/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Detect newest V4 project
        id: project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @()

          function Get-ProjectVersion([string]$projectPath) {
            try {
              [xml]$xml = Get-Content -LiteralPath $projectPath -Raw
              $text = [string]$xml.Project.PropertyGroup.Version
              if ([string]::IsNullOrWhiteSpace($text)) { return [version]'0.0.0' }
              return [version]$text
            } catch { return [version]'0.0.0' }
          }

          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Filter '*.csproj' | ForEach-Object {
            $v = Get-ProjectVersion $_.FullName
            if ($v.Major -ge 4) {
              $candidates += [pscustomobject]@{ Project=$_.FullName; Version=$v; Source='repository' }
            }
          }

          $zips = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Filter '*.zip' | Where-Object {
            $_.Name -match '(?i)chapter[-_ ]?search[-_ ]?pdf.*v4|v4.*webview2|v4.*multiengine'
          }
          foreach ($zip in $zips) {
            Write-Host "Inspecting V4 ZIP: $($zip.FullName)"
            $extractDir = Join-Path $env:RUNNER_TEMP ("chapter-search-v4-" + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
            try {
              Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extractDir -Force
              Get-ChildItem -Path $extractDir -Recurse -File -Filter '*.csproj' | ForEach-Object {
                $v = Get-ProjectVersion $_.FullName
                if ($v.Major -ge 4) {
                  $candidates += [pscustomobject]@{ Project=$_.FullName; Version=$v; Source=$zip.Name }
                }
              }
            } catch { Write-Warning "Could not inspect $($zip.Name): $($_.Exception.Message)" }
          }

          if (-not $candidates -or $candidates.Count -eq 0) { throw 'No V4 .NET project found.' }
          $selected = $candidates | Sort-Object Version -Descending | Select-Object -First 1
          Write-Host "Selected V4 $($selected.Version) from $($selected.Source)"
          Write-Host "Project: $($selected.Project)"
          "path=$($selected.Project)" >> $env:GITHUB_OUTPUT
          "version=$($selected.Version)" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore "${{ steps.project.outputs.path }}" --nologo

      - name: Verify V4 build
        shell: pwsh
        run: |
          dotnet build "${{ steps.project.outputs.path }}" -c Release --no-restore --nologo

      - name: Publish LIGHT x64
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'publish\light'
          dotnet publish "${{ steps.project.outputs.path }}" `
            -c Release -r win-x64 --self-contained false `
            -p:DebugType=None -p:DebugSymbols=false -o $out --nologo

      - name: Publish STANDALONE x64 WebView2-safe
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'publish\standalone'
          dotnet publish "${{ steps.project.outputs.path }}" `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false -p:PublishTrimmed=false `
            -p:DebugType=None -p:DebugSymbols=false -o $out --nologo

      - name: Verify outputs
        shell: pwsh
        run: |
          foreach ($kind in @('light','standalone')) {
            $dir = Join-Path $env:GITHUB_WORKSPACE ("publish\" + $kind)
            $exe = Join-Path $dir 'ChapterSearchPdfV4.exe'
            $assets = Join-Path $dir 'Assets'
            if (-not (Test-Path $exe)) { throw "${kind}: ChapterSearchPdfV4.exe missing" }
            if (-not (Test-Path $assets)) { throw "${kind}: Assets missing" }
            $loader = Get-ChildItem -Path $dir -Recurse -File -Filter 'WebView2Loader.dll' | Select-Object -First 1
            if (-not $loader) { throw "${kind}: WebView2Loader.dll missing" }
            Write-Host "$kind OK: $exe"
          }

      - name: Package Windows builds
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\publish\light\*" -DestinationPath "$env:GITHUB_WORKSPACE\Chapter-Search-PDF-V4-LIGHT-x64.zip" -Force
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\publish\standalone\*" -DestinationPath "$env:GITHUB_WORKSPACE\Chapter-Search-PDF-V4-STANDALONE-x64.zip" -Force

      - name: Upload LIGHT build
        uses: actions/upload-artifact@v4
        with:
          name: Chapter-Search-PDF-V4-LIGHT-x64
          path: Chapter-Search-PDF-V4-LIGHT-x64.zip
          if-no-files-found: error

      - name: Upload STANDALONE build
        uses: actions/upload-artifact@v4
        with:
          name: Chapter-Search-PDF-V4-STANDALONE-x64
          path: Chapter-Search-PDF-V4-STANDALONE-x64.zip
          if-no-files-found: error
