name: Build Chapter Search PDF V3 Native

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.zip'
      - '**/Assets/**'
      - '.github/workflows/build-windows.yml'
      - '.github/workflows/build-windows-v3-native.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Detect or extract V3 project
        id: project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Searching for an extracted V3 project...'
          $proj = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Filter 'ChapterSearchPdfV3.csproj' |
            Select-Object -First 1

          if (-not $proj) {
            Write-Host 'No extracted project found. Searching V3 ZIP files...'

            $zips = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Filter '*.zip' |
              Where-Object {
                $_.Name -match '(?i)chapter[-_ ]?search[-_ ]?pdf.*v3|v3.*webview2|webview2.*native'
              } |
              Sort-Object LastWriteTimeUtc -Descending

            if (-not $zips) {
              throw 'No Chapter Search PDF V3 project or V3 ZIP was found.'
            }

            foreach ($zip in $zips) {
              Write-Host "Inspecting V3 ZIP: $($zip.FullName)"
              $extractDir = Join-Path $env:RUNNER_TEMP ("chapter-search-v3-" + [guid]::NewGuid().ToString('N'))
              New-Item -ItemType Directory -Path $extractDir -Force | Out-Null

              try {
                Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extractDir -Force
              }
              catch {
                Write-Warning "Could not extract $($zip.Name): $($_.Exception.Message)"
                continue
              }

              $candidate = Get-ChildItem -Path $extractDir -Recurse -File -Filter 'ChapterSearchPdfV3.csproj' |
                Select-Object -First 1

              if ($candidate) {
                $proj = $candidate
                break
              }
            }
          }

          if (-not $proj) {
            throw 'ChapterSearchPdfV3.csproj was not found in the repository or V3 ZIP files.'
          }

          Write-Host "V3 project found: $($proj.FullName)"
          Write-Host "Project folder: $($proj.Directory.FullName)"

          "path=$($proj.FullName)" >> $env:GITHUB_OUTPUT
          "dir=$($proj.Directory.FullName)" >> $env:GITHUB_OUTPUT

      - name: Restore V3 dependencies
        shell: pwsh
        run: |
          dotnet restore "${{ steps.project.outputs.path }}" --nologo

      - name: Verify V3 build
        shell: pwsh
        run: |
          dotnet build "${{ steps.project.outputs.path }}" `
            -c Release `
            --no-restore `
            --nologo

      - name: Publish LIGHT x64
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'publish\light'
          dotnet publish "${{ steps.project.outputs.path }}" `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $out `
            --nologo

      - name: Publish STANDALONE x64
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'publish\standalone'
          dotnet publish "${{ steps.project.outputs.path }}" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $out `
            --nologo

      - name: Show generated files
        shell: pwsh
        run: |
          Write-Host '=== LIGHT ==='
          Get-ChildItem "$env:GITHUB_WORKSPACE\publish\light" -Recurse |
            Select-Object FullName, Length |
            Format-Table -AutoSize

          Write-Host '=== STANDALONE ==='
          Get-ChildItem "$env:GITHUB_WORKSPACE\publish\standalone" -Recurse |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      - name: Package Windows builds
        shell: pwsh
        run: |
          $lightZip = Join-Path $env:GITHUB_WORKSPACE 'Chapter-Search-PDF-V3-LIGHT-x64.zip'
          $standaloneZip = Join-Path $env:GITHUB_WORKSPACE 'Chapter-Search-PDF-V3-STANDALONE-x64.zip'

          Compress-Archive `
            -Path "$env:GITHUB_WORKSPACE\publish\light\*" `
            -DestinationPath $lightZip `
            -Force

          Compress-Archive `
            -Path "$env:GITHUB_WORKSPACE\publish\standalone\*" `
            -DestinationPath $standaloneZip `
            -Force

      - name: Upload LIGHT build
        uses: actions/upload-artifact@v4
        with:
          name: Chapter-Search-PDF-V3-LIGHT-x64
          path: Chapter-Search-PDF-V3-LIGHT-x64.zip
          if-no-files-found: error

      - name: Upload STANDALONE build
        uses: actions/upload-artifact@v4
        with:
          name: Chapter-Search-PDF-V3-STANDALONE-x64
          path: Chapter-Search-PDF-V3-STANDALONE-x64.zip
          if-no-files-found: error
