name: Build Windows PC EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Extract PC project
        shell: pwsh
        run: |
          $zip = "chapter-search-pdf-pc-v1.1-node24.zip"

          if (-not (Test-Path $zip)) {
            throw "PC project ZIP not found: $zip"
          }

          $dest = Join-Path $env:GITHUB_WORKSPACE "pc-project"

          if (Test-Path $dest) {
            Remove-Item $dest -Recurse -Force
          }

          New-Item -ItemType Directory -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force

          $package = Get-ChildItem `
            -Path $dest `
            -Filter package.json `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $package) {
            throw "package.json was not found inside $zip"
          }

          $projectDir = $package.Directory.FullName

          Write-Host "PC project directory: $projectDir"

          "PROJECT_DIR=$projectDir" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Show versions
        shell: pwsh
        run: |
          node --version
          npm --version

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          npm install --no-audit --no-fund

      - name: Build Windows EXE
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          npm run build:win

      - name: Verify Windows EXE
        shell: pwsh
        run: |
          $dist = Join-Path $env:PROJECT_DIR "dist"

          if (-not (Test-Path $dist)) {
            throw "dist folder was not generated"
          }

          Get-ChildItem -Path $dist -Recurse

          $exe = Get-ChildItem `
            -Path $dist `
            -Filter *.exe `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (-not $exe) {
            throw "No Windows .exe was generated"
          }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v6
        with:
          name: Chapter-Search-PDF-Windows-PC
          path: |
            pc-project/**/dist/*.exe
            pc-project/**/dist/*.yml
          if-no-files-found: error
          retention-days: 14
