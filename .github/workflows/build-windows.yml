name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="chapter-search-pdf-v4-meta-search-downloads.zip"

          echo "=== Repository content ==="
          find . -maxdepth 2 -type f | sort

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Android ZIP not found: $ZIP_FILE"
            exit 1
          fi

          echo "Android ZIP found: $ZIP_FILE"

          rm -rf extracted_android
          mkdir -p extracted_android

          unzip -q "$ZIP_FILE" -d extracted_android

          echo "=== Extracted files ==="
          find extracted_android -maxdepth 5 -type f | sort | head -300

          GRADLEW="$(find extracted_android \
            -type f \
            -name gradlew \
            | head -n 1 || true)"

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew was not found inside the Android project."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          chmod +x "$GRADLEW"

          echo "Gradle wrapper: $GRADLEW"
          echo "Android project: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "Checking Gradle tasks..."

          if ./gradlew tasks --all | grep -q "assembleDebug"; then
            echo "Building Debug APK..."

            ./gradlew assembleDebug \
              --stacktrace \
              --no-daemon
          else
            echo "::error::assembleDebug task not found."

            ./gradlew tasks --all

            exit 1
          fi

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p apk-output

          APK_COUNT=0

          while IFS= read -r -d '' APK
          do
            echo "APK found: $APK"

            cp "$APK" \
              "apk-output/$(basename "$APK")"

            APK_COUNT=$((APK_COUNT + 1))

          done < <(
            find "$PROJECT_DIR" \
              -type f \
              -path '*/build/outputs/apk/*' \
              -name '*.apk' \
              -print0
          )

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::Build completed but no APK was found."

            find "$PROJECT_DIR" \
              -type f \
              \( -name '*.apk' -o -name '*.aab' \) \
              -print || true

            exit 1
          fi

          echo "APK count: $APK_COUNT"

          ls -lh apk-output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chapter-Search-PDF-Android
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
