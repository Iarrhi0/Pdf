name: Unzip and Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | sort | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "Aucun fichier ZIP trouvé à la racine du dépôt."
            exit 1
          fi

          echo "ZIP détecté : $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf extracted-project
          mkdir extracted-project

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d extracted-project

          echo "Contenu extrait :"
          find extracted-project -maxdepth 3 -type f | sort | head -100

      - name: Detect Android project root
        id: android_root
        shell: bash
        run: |
          set -e

          if [ -f "extracted-project/settings.gradle.kts" ] || [ -f "extracted-project/settings.gradle" ]; then
            PROJECT_DIR="extracted-project"
          else
            SETTINGS_FILE="$(find extracted-project -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "Projet Android introuvable : aucun settings.gradle ou settings.gradle.kts."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          echo "Projet Android détecté dans : $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: ${{ steps.android_root.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -e

          APK_FILE="$(find "${{ steps.android_root.outputs.project_dir }}" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "APK introuvable après le build."
            exit 1
          fi

          echo "APK trouvé : $APK_FILE"
          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chapter-PDF-APK
          path: ${{ steps.apk.outputs.apk_file }}
          if-no-files-found: error
