name: Unzip and Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(find . -type f -name gradlew -not -path './.git/*' | head -n 1 || true)"

          if [ -z "$GRADLEW" ]; then
            ZIP_FILE="$(find . -type f -iname '*.zip' -not -path './.git/*' | head -n 1 || true)"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No Android project (gradlew) and no ZIP file found."
              exit 1
            fi

            echo "ZIP found: $ZIP_FILE"
            rm -rf extracted_project
            mkdir -p extracted_project
            unzip -q "$ZIP_FILE" -d extracted_project

            GRADLEW="$(find extracted_project -type f -name gradlew | head -n 1 || true)"
          fi

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew was not found after extraction."
            find extracted_project -maxdepth 4 -type f 2>/dev/null | sort | head -300 || true
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "Gradle wrapper: $GRADLEW"
          echo "Project directory: $PROJECT_DIR"

          chmod +x "$GRADLEW"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show Gradle information
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --version

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          if ./gradlew tasks --all | grep -qE '(^|[[:space:]])assembleDebug([[:space:]]|$)'; then
            ./gradlew assembleDebug --stacktrace
          else
            MODULE_TASK="$(
              ./gradlew tasks --all |
              sed -n 's/^[[:space:]]*\(:[^[:space:]]*:assembleDebug\).*/\1/p' |
              head -n 1
            )"

            if [ -z "$MODULE_TASK" ]; then
              echo "::error::No assembleDebug task found."
              ./gradlew tasks --all
              exit 1
            fi

            echo "Using task: $MODULE_TASK"
            ./gradlew "$MODULE_TASK" --stacktrace
          fi

      - name: Locate generated APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p apk-output
          APK_COUNT=0

          while IFS= read -r -d '' APK; do
            echo "Found APK: $APK"
            cp "$APK" "apk-output/$(basename "$APK")"
            APK_COUNT=$((APK_COUNT + 1))
          done < <(
            find "${PROJECT_DIR}"               -type f               -path '*/build/outputs/apk/*'               -name '*.apk'               -print0
          )

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::Build finished but no APK was found."
            find "${PROJECT_DIR}" -type f \( -name '*.apk' -o -name '*.aab' \) -print || true
            exit 1
          fi

          ls -lh apk-output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
