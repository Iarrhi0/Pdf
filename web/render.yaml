services:
  - type: web
    name: chapter-search-pdf-web-auto
    runtime: node
    plan: free
    region: singapore
    rootDir: web
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CSPDF_PROXY_CONCURRENCY
        value: "4"
